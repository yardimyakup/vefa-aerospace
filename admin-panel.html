<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🛡️  GÜVENLİK (SECURITY): Katı Koruma, Anti-XSS, Anti-Frame -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src 'self' https://www.youtube.com; object-src 'none'; base-uri 'self';">
<meta name="referrer" content="no-referrer">

<title>Vefa Akademi - Akıllı İçerik Editörü V5.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070d18;
  --panel: #0f1a2e;
  --panel2: #162035;
  --border: #1e3050;
  --border2: #243860;
  --text: #e8f0fe;
  --muted: #607090;
  --muted2: #8aa0c0;
  --cyan: #0ea5e9;
  --cyan2: #38bdf8;
  --green: #10b981;
  --red: #ef4444;
  --gold: #f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── HEADER ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  background: linear-gradient(180deg, rgba(14,165,233,0.06) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-brand { display: flex; align-items: center; gap: 12px; }
.header-brand h1 { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800; letter-spacing: 0.05em; color: var(--text); }
.badge { font-size: 0.7rem; font-weight: 600; font-family: 'JetBrains Mono', monospace; padding: 3px 8px; border-radius: 4px; background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); letter-spacing: 0.05em; }
.header-actions { display: flex; gap: 8px; align-items: center; }

/* ── BUTTONS ── */
.btn { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border2); background: var(--panel2); color: var(--text); transition: all 0.2s; font-family: 'Inter', sans-serif; }
.btn:hover { background: var(--border); }
.btn-primary { background: var(--cyan); border-color: var(--cyan); color: #fff; display: flex; align-items: center; gap: 8px; }
.btn-primary:hover { background: var(--cyan2); }
.btn-success { background: rgba(16,185,129,0.15); border-color: var(--green); color: var(--green); }
.btn-success:hover { background: rgba(16,185,129,0.3); }
.btn-sm { padding: 4px 10px; font-size: 0.75rem; }

/* ── LAYOUT ── */
.workspace { display: flex; gap: 0; flex: 1; min-height: 0; overflow: hidden; }

/* ── LEFT PANEL ── */
.left-panel { width: 55%; display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }

/* ── META FIELDS ── */
.meta-section { padding: 12px 16px; background: rgba(14,165,233,0.04); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.meta-row { display: flex; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.field label { font-size: 0.65rem; font-family: 'JetBrains Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.field input { background: var(--bg); border: 1px solid var(--border2); color: var(--text); padding: 7px 10px; border-radius: 5px; font-size: 0.85rem; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
.field input:focus { border-color: var(--cyan); }
.field input.accent { border-color: rgba(14,165,233,0.4); }

/* ── TOOLBAR ── */
.toolbar { padding: 8px 12px; background: var(--panel2); border-bottom: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
.t-btn { background: var(--bg); border: 1px solid var(--border2); color: var(--muted2); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.78rem; font-weight: 600; transition: all 0.2s; white-space: nowrap; }
.t-btn:hover { background: var(--cyan); border-color: var(--cyan); color: #fff; }
.t-btn.green { color: var(--green); border-color: rgba(16,185,129,0.4); }
.t-btn.green:hover { background: var(--green); color: #fff; border-color: var(--green); }
.t-btn.red { color: var(--red); border-color: rgba(239,68,68,0.4); }
.t-btn.red:hover { background: var(--red); color: #fff; border-color: var(--red); }
.t-sep { width: 1px; background: var(--border); height: 20px; margin: 0 2px; }

/* ── EDITOR ── */
.editor-wrap { flex: 1; overflow-y: auto; background: #050c18; position: relative; }
.editor-area {
  min-height: 100%; padding: 30px 36px;
  outline: none;
  font-size: 1.1rem; line-height: 1.85;
  color: #a8c0d6; font-weight: 300;
}
.editor-area:empty::before { content: attr(data-placeholder); color: var(--muted); font-style: italic; display: block; }
.editor-area p { margin-bottom: 20px; }
.editor-area h2 { font-family: 'Syne', sans-serif; font-size: 1.9rem; font-weight: 800; color: #fff; margin: 40px 0 18px; border-left: 4px solid var(--cyan); padding-left: 16px; line-height: 1.2; }
.editor-area h3 { font-size: 1.35rem; font-weight: 600; color: #e2eaf5; margin: 30px 0 14px; padding-left: 14px; border-left: 3px solid rgba(14,165,233,0.4); }
.editor-area ul, .editor-area ol { margin-bottom: 20px; padding-left: 22px; }
.editor-area li { margin-bottom: 8px; color: #a8c0d6; }
.editor-area li::marker { color: var(--cyan); font-weight: bold; }
.editor-area blockquote { background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.2); border-left: 4px solid var(--red); padding: 22px 28px; margin: 30px 0; border-radius: 0 12px 12px 0; font-size: 1.2rem; font-style: italic; color: #f1c0c0; }
.editor-area .math-formula { background: rgba(16,185,129,0.08); border-left: 4px solid var(--green); padding: 14px 20px; font-family: 'JetBrains Mono', monospace; font-size: 1.05rem; color: var(--green); margin: 24px 0; border-radius: 4px; display: block; letter-spacing: 0.05em; }
.editor-area .info-box { background: rgba(14,165,233,0.08); border: 1px solid rgba(14,165,233,0.25); border-left: 4px solid var(--cyan); padding: 18px 22px; margin: 24px 0; border-radius: 0 10px 10px 0; color: #c5ddf5; }
.editor-area strong { color: #fff; font-weight: 700; }
.editor-area em { color: var(--cyan2); font-style: italic; }
.editor-area hr { border: none; border-top: 1px solid var(--border2); margin: 30px 0; }
.editor-area .article-img-wrap { margin: 30px 0; text-align: center; }
.editor-area .article-img-wrap img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border2); }

/* ── PASTE INDICATOR ── */
.paste-flash { position: fixed; top: 20px; right: 20px; background: rgba(16,185,129,0.9); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; font-family: 'JetBrains Mono', monospace; }
.paste-flash.show { opacity: 1; }

/* ── RIGHT PANEL ── */
.right-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.output-section { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.output-header { padding: 10px 16px; background: rgba(16,185,129,0.08); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.output-header span { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--green); text-transform: uppercase; letter-spacing: 0.08em; }
.code-area { flex: 1; padding: 16px; background: #030810; color: #4ade80; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; border: none; resize: none; outline: none; line-height: 1.6; overflow-y: auto; }

.card-section { flex-shrink: 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; max-height: 180px; }
.card-header { padding: 8px 16px; background: rgba(14,165,233,0.08); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.card-header span { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--cyan); text-transform: uppercase; letter-spacing: 0.08em; }
.card-area { flex: 1; padding: 12px 16px; background: #030810; color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; border: none; resize: none; outline: none; line-height: 1.5; overflow-y: auto; }

/* ── STATUS BAR ── */
.status-bar { display: flex; gap: 20px; padding: 6px 20px; background: var(--panel); border-top: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); flex-shrink: 0; }
.status-item { display: flex; align-items: center; gap: 6px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <h1>VEFA AKADEMİ — Akıllı Editör</h1>
    <span class="badge">V5.0 ULTRA</span>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="clearAll()">Temizle</button>
    <button class="btn btn-primary" onclick="generateFullCode()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
      Makale Kodunu Üret

<div class="workspace">

  <!-- LEFT -->
  <div class="left-panel">
    <div class="meta-section">
      <div class="meta-row">
        <div class="field" style="flex:2">
          <label>Makale Başlığı</label>
          <input type="text" id="mTitle" placeholder="Roket Motoru Tasarım Esasları">
        </div>
        <div class="field" style="flex:1">

      </div>
      <div class="meta-row">
        <div class="field">

        <div class="field" style="flex:0.6">
          <label>Okuma Süresi</label>
          <input type="text" id="mReadTime" placeholder="8 Dk">
        </div>
      </div>
      <div class="meta-row">
        <div class="field" style="flex:2">
          <label>SEO Özeti</label>
          <input type="text" id="mDesc" placeholder="Arama motorları için 1-2 cümle açıklama...">

        <div class="field" style="flex:1.2">

    <div class="toolbar">

      <button class="t-btn" onclick="insertImage()" style="color: var(--gold); border-color: rgba(245,158,11,0.4)">🖼️ Fotoğraf</button>
      <button class="t-btn" onclick="insertDivider()">── Ayırıcı</button>

      <button class="t-btn" onclick="execCmd('removeFormat')" style="margin-left:auto; opacity:0.6">✕ Temizle</button>
    </div>

    <div class="editor-wrap">
      <div class="editor-area" id="editor" contenteditable="true" data-placeholder="Metni buraya yapıştırın. Sistem her satırı analiz edip otomatik biçimlendirir: başlıklar, alıntılar, formüller, listeler..."></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right-panel">

      <div class="output-header">

      </div>

// Çıkan kodu kopyalayıp yeni bir .html dosyasına kaydedin."></textarea>

    <div class="card-section">
      <div class="card-header">
        <span>🃏 Vitrin Kartı (akademi.html)</span>
        <button class="btn btn-sm" id="copyBtn2" onclick="copyCode('cardOutput','copyBtn2')" style="display:none; border-color:var(--cyan); color:var(--cyan)">Kartı Kopyala</button>
      </div>

</div>

<div class="status-bar">
  <div class="status-item"><div class="status-dot"></div><span id="wordCount">0 kelime</span></div>
  <div class="status-item"><span id="charCount">0 karakter</span></div>
  <div class="status-item"><span id="paraCount">0 paragraf</span></div>
  <div class="status-item" style="margin-left:auto"><span id="lastAction">Hazır</span></div>
</div>

<div class="paste-flash" id="pasteFlash">✓ Metin yapıştırıldı ve güzelleştirildi</div>

<script>
// ══════════════════════════════════════════════════════════
//  ULTRA AKILLI METİN İŞLEME SİSTEMİ V5
// ══════════════════════════════════════════════════════════

const HEADING_PATTERNS = [
  /^[A-ZÇĞİÖŞÜ][^.!?]{0,70}[^.!?,]$/,
];

const FORMULA_PATTERNS = [
  /^[A-Za-zΔαβγθλμπρσ\d\s+\-*/^(){}[\].,=<>≤≥∑∫√±∞]+$/,
];

const QUOTE_STARTERS = ['"', '"', '"', '«', '\'\'', '"\''];
const QUOTE_ENDERS   = ['"', '"', '"', '»', '\'\'', '\"'];

const LIST_MARKERS   = /^(\s*[\-\•\*\·]\s+|[\d]+[.)\s]\s+)/;
const NUMBERED_LIST  = /^(\s*\d+[.)]\s+)/;

function isHeading(line) {
  const trimmed = line.trim();
  if (!trimmed || trimmed.length < 2) return false;
  let score = 0;
  const words = trimmed.split(/\s+/);
  const len = trimmed.length;
  if (len >= 3 && len <= 90) score += 3;
  if (len > 90) score -= 5;
  if (words.length >= 1 && words.length <= 10) score += 2;
  if (words.length > 12) score -= 3;
  if (!trimmed.match(/[.!?,]$/)) score += 3;
  if (trimmed.endsWith(':')) score += 5; // Sona ':' gelen satır büyük ihtimalle başlık
  if (trimmed.charAt(0) === trimmed.charAt(0).toUpperCase() && trimmed.charAt(0).match(/[A-ZÇĞİÖŞÜ]/)) score += 1;
  const upperRatio = (trimmed.match(/[A-ZÇĞİÖŞÜ]/g) || []).length / trimmed.replace(/\s/g,'').length;
  if (upperRatio > 0.5) score += 3;
  if (!trimmed.includes('"') && !trimmed.includes('"')) score += 1;
  if (trimmed.match(/^\d/)) score -= 2;
  return score >= 5;
}

function isFormula(line) {
  const t = line.trim();
  if (t.includes('=') && t.length < 60) {
    const hasLetters = /[a-zA-ZΔαβγθλπρσμ]/.test(t);
    const hasMathOp  = /[+\-*/^√∑∫±]/.test(t);
    const dotCount   = (t.match(/\./g) || []).length;
    if (hasLetters && (hasMathOp || dotCount === 0)) return true;
  }
  if (t.startsWith('$$') || t.startsWith('\\[')) return true;
  return false;
}

function isQuote(line) {
  const t = line.trim();
  return QUOTE_STARTERS.some(q => t.startsWith(q)) || t.startsWith('"');
}

function isListItem(line) { return LIST_MARKERS.test(line.trim()); }
function isNumberedListItem(line) { return NUMBERED_LIST.test(line.trim()); }

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function enhanceParagraph(text) {
  let t = escapeHtml(text);
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
  t = t.replace(/`([^`]+)`/g, '<span style="font-family:monospace;color:#10b981;background:rgba(16,185,129,0.1);padding:1px 5px;border-radius:3px;font-size:0.9em">$1</span>');
  return t;
}

function processText(rawText) {
  const lines = rawText.split(/\n/);
  const blocks = [];
  let paraBuffer = [];
  let listBuffer = [];
  let listType   = null;

  function flushPara() {
    if (paraBuffer.length > 0) {
      const joined = paraBuffer.join(' ').trim();
      if (joined) blocks.push({ type: 'p', text: joined });
      paraBuffer = [];
    }
  }
  function flushList() {
    if (listBuffer.length > 0) {
      blocks.push({ type: listType, items: [...listBuffer] });
      listBuffer = [];
      listType = null;
    }
  }

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const t   = raw.trim();
    if (!t) { flushPara(); flushList(); continue; }
    if (isFormula(t)) { flushPara(); flushList(); const clean = t.replace(/^\$\$|\$\$$/g,'').replace(/^\\\[|\\\]$/g,'').trim(); blocks.push({ type: 'formula', text: clean }); continue; }
    if (isQuote(t)) { flushPara(); flushList(); let clean = t.replace(/^["""«]\s*/, '').replace(/["""»]+$/, '').trim(); blocks.push({ type: 'quote', text: clean }); continue; }
    if (isNumberedListItem(t)) { flushPara(); if (listType !== 'ol') { flushList(); listType = 'ol'; } const clean = t.replace(NUMBERED_LIST,'').trim(); listBuffer.push(clean); continue; }
    if (isListItem(t)) { flushPara(); if (listType !== 'ul') { flushList(); listType = 'ul'; } const clean = t.replace(LIST_MARKERS,'').trim(); listBuffer.push(clean); continue; }
    if (isHeading(t)) { flushPara(); flushList(); const upperRatio = (t.match(/[A-ZÇĞİÖŞÜ]/g)||[]).length / t.replace(/\s/g,'').length; const hText = t.endsWith(':') ? t.slice(0,-1) : t; const type = (t.length < 45 && upperRatio > 0.25) ? 'h2' : 'h3'; blocks.push({ type, text: hText }); continue; }
    if (/^[-*_]{3,}$/.test(t)) { flushPara(); flushList(); blocks.push({ type: 'hr' }); continue; }

    // 📌 Bilgi kutusu otomatik tespiti: "Not:", "Dikkat:", "Önemli:" gibi başlayan satırlar
    const infoMatch = t.match(/^(Not|Dikkat|Önemli|Bilgi|İpucu|Uyarı|Warning|Note):\s*(.+)$/i);
    if (infoMatch) { flushPara(); flushList(); blocks.push({ type: 'info', text: infoMatch[2].trim() }); continue; }

    // 📌 Gömülü başlık tespiti: "Kelime/Kelimeler: Uzun içerik..." formatı
    // Satır başındaki 1-5 kelime ve ':' sonrası en az 30 karakterlik içerik varsa başlık+paragraf yap
    const embMatch = t.match(/^([A-ZÇĞİÖŞÜa-zçğışöü][^:\n]{1,60}):\s+([A-ZÇĞİÖŞÜa-zçğışöü].{30,})$/);
    if (embMatch) {
      const headPart = embMatch[1].trim();
      const restPart = embMatch[2].trim();
      const wc = headPart.split(/\s+/).length;
      if (wc >= 1 && wc <= 5) {
        flushPara(); flushList();
        blocks.push({ type: 'h3', text: headPart });
        paraBuffer.push(restPart);
        continue;
      }
    }

    flushList(); paraBuffer.push(t);
  }
  flushPara(); flushList();

  return blocks.map(b => {
    switch(b.type) {
      case 'h2': return `<h2>${escapeHtml(b.text)}</h2>`;
      case 'h3': return `<h3>${escapeHtml(b.text)}</h3>`;
      case 'p': return `<p>${enhanceParagraph(b.text)}</p>`;
      case 'quote': return `<blockquote>${enhanceParagraph(b.text)}</blockquote>`;
      case 'formula': return `<div class="math-formula">${escapeHtml(b.text)}</div>`;
      case 'info': return `<div class="info-box"><strong>💡 Bilgi:</strong> ${enhanceParagraph(b.text)}</div>`;
      case 'ul': return `<ul>${b.items.map(i=>`<li>${enhanceParagraph(i)}</li>`).join('')}</ul>`;
      case 'ol': return `<ol>${b.items.map(i=>`<li>${enhanceParagraph(i)}</li>`).join('')}</ol>`;
      case 'hr': return `<hr>`;
      default: return `<p>${escapeHtml(b.text||'')}</p>`;
    }
  }).join('\n');
}

document.getElementById('editor').addEventListener('paste', function(e) {
  e.preventDefault();
  const raw = (e.originalEvent || e).clipboardData.getData('text/plain');
  if (!raw.trim()) return;
  const html = processText(raw);
  document.execCommand('insertHTML', false, html);
  const flash = document.getElementById('pasteFlash');
  flash.classList.add('show');
  setTimeout(()=> flash.classList.remove('show'), 2500);
  updateStatus();
  setLastAction('Metin yapıştırıldı ve işlendi');
});

function execCmd(cmd, val=null) {
  document.execCommand(cmd, false, val);
  document.getElementById('editor').focus();
}

function insertBlockquote() {
  const sel = window.getSelection();
  const selected = sel && sel.toString().trim();
  if (selected) { document.execCommand('formatBlock', false, 'BLOCKQUOTE'); } 
  else { const text = prompt('Alıntı metnini girin:'); if (text) { document.execCommand('insertHTML', false, `<blockquote>${text}</blockquote><p><br></p>`); } }
}

function insertFormula() {
  const eq = prompt('Formül veya terminal kodu (Örn: F = m × a):');
  if (eq) { document.execCommand('insertHTML', false, `<div class="math-formula">${escapeHtml(eq)}</div><p><br></p>`); }
}

function insertInfoBox() {
  const txt = prompt('Bilgi kutusu içeriği:');
  if (txt) { document.execCommand('insertHTML', false, `<div class="info-box"><strong>💡 Bilgi:</strong> ${txt}</div><p><br></p>`); }
}

function insertImage() {
  const url = prompt('Fotoğraf URL adresini:');
  if (url) { document.execCommand('insertHTML', false, `<div class="article-img-wrap"><img src="${escapeHtml(url)}" alt="Makale Görseli"></div><p><br></p>`); }
}

function insertDivider() { document.execCommand('insertHTML', false, `<hr><p><br></p>`); }

function reprocessContent() {
  const editor = document.getElementById('editor');
  const raw = editor.innerText || '';
  if (!raw.trim()) { alert('Editör boş!'); return; }
  const html = processText(raw);
  editor.innerHTML = html;
  updateStatus();
  setLastAction('⚡ İçerik yeniden işlendi — başlıklar, alıntılar ve bilgi kutuları otomatik tespit edildi ✓');
}

function updateStatus() {
  const editor = document.getElementById('editor');
  const text   = editor.innerText || '';
  const words  = text.trim().split(/\s+/).filter(w=>w).length;
  const chars  = text.length;
  const paras  = editor.querySelectorAll('p,h2,h3,blockquote,li').length;
  document.getElementById('wordCount').textContent = words + ' kelime';
  document.getElementById('charCount').textContent = chars + ' karakter';
  document.getElementById('paraCount').textContent = paras + ' blok';
}

function setLastAction(msg) { document.getElementById('lastAction').textContent = msg; }

document.getElementById('editor').addEventListener('input', updateStatus);
document.getElementById('editor').addEventListener('focus', function() {
  if (!this.innerHTML.trim()) document.execCommand('formatBlock', false, 'P');
});

function clearAll() {
  if (confirm('Editörü temizlemek istiyor musunuz?')) {
    document.getElementById('editor').innerHTML = '';
    document.getElementById('codeOutput').value = '';
    document.getElementById('cardOutput').value = '';
    document.getElementById('copyBtn').style.display = 'none';
    document.getElementById('copyBtn2').style.display = 'none';
    updateStatus();
  }
}

function copyCode(id, btnId) {
  const el = document.getElementById(id);
  el.select(); el.setSelectionRange(0, 99999);
  document.execCommand('copy');
  const btn = document.getElementById(btnId);
  const orig = btn.textContent;
  btn.textContent = '✓ Kopyalandı';
  setTimeout(()=> btn.textContent = orig, 2000);
}

function formatDate() {
  const d = new Date();
  const months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function toSlug(str) {
  return str
    .replace(/[ğĞ]/g,'g').replace(/[üÜ]/g,'u').replace(/[şŞ]/g,'s')
    .replace(/[ıİ]/g,'i').replace(/[öÖ]/g,'o').replace(/[çÇ]/g,'c')
    .toLowerCase().replace(/[^a-z0-9\s]/g,'').trim().replace(/\s+/g,'-');
}

function generateFullCode() {

    .replace(/<i(\s|>)/gi, '<em$1')

  const html = `<!DOCTYPE html>
